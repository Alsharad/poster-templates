name: "DarkMatte Style"
description: "DarkMatte style with gradient overlay and logo placement"
version: "1.5"

# Steps — engine auto-normalises the base image to 1000x1500 before these run
steps:
  - name: "Darken base image"
    args:
      - "-level"
      - "-54%,80%"
      - "-colorspace"
      - "RGB"

  - name: "Apply gradient overlay"
    args:
      - "("
      - "-size"
      - "1000x200"
      - "xc:#1f1f1f"
      - ")"
      - "-gravity"
      - "south"
      - "-composite"
      - "("
      - "-size"
      - "1000x750"
      - "xc:#1f1f1f"
      - "("
      - "-size"
      - "1000x750"
      - "gradient:black-white"
      - ")"
      - "-alpha"
      - "off"
      - "-compose"
      - "copy-opacity"
      - "-composite"
      - ")"
      - "-gravity"
      - "south"
      - "-geometry"
      - "+0+200"
      - "-compose"
      - "over"
      - "-composite"

  - name: "Apply collection overlay"
    condition: "isCollection"
    args:
      - "{{templateResources}}/overlays/defaultCollection.png"
      - "-composite"

  - name: "Add logo"
    condition: "hasLogo"
    args:
      - "("
      - "{{logoPath}}"
      - "-resize"
      - "600x260"
      - ")"
      - "-gravity"
      - "south"
      - "-geometry"
      - "+0+175"
      - "-composite"

  - name: "Add title text"
    condition: "!hasLogo"
    args:
      - "("
      - "-size"
      - "800x150"
      - "-background"
      - "none"
      - "-fill"
      - "white"
      - "-font"
      - "{{templateResources}}/fonts/core-sans-a/CoreSansA65Bold.otf"
      - "caption:{{title}}"
      - ")"
      - "-gravity"
      - "south"
      - "-geometry"
      - "+0+175"
      - "-composite"

  - name: "Add season text"
    condition: "isSeason and seasonName != null"
    args:
      - "-font"
      - "{{templateResources}}/fonts/core-sans-a/CoreSansA65Bold.otf"
      - "-pointsize"
      - "40"
      - "-fill"
      - "white"
      - "-stroke"
      - "none"
      - "-strokewidth"
      - "0"
      - "-gravity"
      - "south"
      - "-annotate"
      - "+0+125"
      - "{{seasonName}}"
